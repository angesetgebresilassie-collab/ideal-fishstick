name: Build Android APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./android-freeform

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'
          cache-dependency-path: 'android-freeform/**/*.gradle*'

      - name: Generate Gradle Wrapper if missing
        run: |
          if [ ! -f ./gradlew ]; then
            echo "Gradle wrapper not found in android-freeform. Bootstrapping Gradle 8.5..."
            wget -q https://services.gradle.org/distributions/gradle-8.5-bin.zip -O /tmp/gradle-8.5-bin.zip
            unzip -q /tmp/gradle-8.5-bin.zip -d /tmp
            /tmp/gradle-8.5/bin/gradle wrapper --gradle-version 8.5
            rm -rf /tmp/gradle-8.5*
          fi
          chmod +x gradlew

      - name: Generate Dummy Keystore
        run: |
          mkdir -p app/keystore
          keytool -genkey -v \
            -keystore app/keystore/dummy-key.jks \
            -alias dummyAlias \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass dummypassword \
            -keypass dummypassword \
            -dname "CN=Developer, OU=Dev, O=Company, L=City, ST=State, C=US"

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android-freeform/app/build/outputs/apk/debug/app-debug.apk
          
