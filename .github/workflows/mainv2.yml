name: Build Android APK (android-freeform)

on:
  workflow_dispatch: {}
  push:
    branches:
      - main

jobs:
  build-apk:
    name: Build android-freeform APK
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    env:
      ANDROID_SDK_ROOT: ${{ runner.temp }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}

      - name: Install Android command-line tools and SDK components
        run: |
          set -e
          SDK_DIR="$ANDROID_SDK_ROOT/android-sdk"
          mkdir -p "$SDK_DIR"
          echo "SDK root: $SDK_DIR"
          sudo apt-get update -y
          sudo apt-get install -y unzip wget
          CLI_ZIP=/tmp/cmdline-tools.zip
          wget -q -O "$CLI_ZIP" "https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip"
          unzip -q "$CLI_ZIP" -d /tmp/cmdline-tools-temp
          mkdir -p "$SDK_DIR/cmdline-tools/latest"
          mv /tmp/cmdline-tools-temp/cmdline-tools/* "$SDK_DIR/cmdline-tools/latest/"
          rm -rf /tmp/cmdline-tools-temp "$CLI_ZIP"
          export PATH="$SDK_DIR/cmdline-tools/latest/bin:$PATH"
          yes | sdkmanager --sdk_root="${SDK_DIR}" --licenses
          sdkmanager --sdk_root="${SDK_DIR}" "platform-tools" "platforms;android-34" "build-tools;34.0.0"
        shell: bash

      - name: Ensure gradle wrapper executable if present
        run: |
          if [ -f ./gradlew ]; then chmod +x ./gradlew; fi

      - name: Install Gradle if no wrapper present
        run: |
          if [ -f ./gradlew ]; then
            echo "Gradle wrapper found, skipping install."
          else
            echo "No gradle wrapper; installing Gradle CLI..."
            GRADLE_VERSION=8.6
            wget -q https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip -O /tmp/gradle.zip
            sudo unzip -q /tmp/gradle.zip -d /opt/gradle
            sudo ln -sfn /opt/gradle/gradle-${GRADLE_VERSION}/bin/gradle /usr/local/bin/gradle
            gradle --version
          fi

      - name: Build APK (Release if possible, fallback to Debug)
        working-directory: android-freeform
        run: |
          set -e
          SDK_DIR="$ANDROID_SDK_ROOT/android-sdk"
          export PATH="$SDK_DIR/platform-tools:$PATH"
          # Prefer wrapper if present (check in repo root and in android-freeform)
          if [ -f ../gradlew ]; then
            ../gradlew :app:assembleRelease || ../gradlew :app:assembleDebug
          elif [ -f ./gradlew ]; then
            ./gradlew assembleRelease || ./gradlew assembleDebug
          else
            gradle :app:assembleRelease || gradle :app:assembleDebug
          fi

      - name: Collect APKs
        run: |
          set -e
          echo "Searching for APKs under android-freeform/app/build/outputs..."
          mkdir -p build-artifacts
          find android-freeform/app/build -type f -name "*.apk" -print -exec cp {} build-artifacts/ \; || true
          ls -lah build-artifacts || true

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-freeform-apks
          path: build-artifacts/
